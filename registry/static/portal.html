<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project registry</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
    --accent: #2f5d8a; --ok: #2e7d4f; --warn: #a3620a; --bad: #b3261e; --chip: #eeede8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a93; --line: #34332f;
            --accent: #8db4d9; --ok: #7cc49a; --warn: #e0a64a; --bad: #f08a80; --chip: #2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  nav { display: flex; flex-wrap: wrap; }
  .me { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  nav button { background: none; border: 0; padding: 6px 7px; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; }
  nav button.active { background: var(--chip); color: var(--text); }
  .spacer { flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; overflow-x: auto; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr.clickable { cursor: pointer; } tr.clickable:hover { background: var(--chip); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--chip); font-size: 12px; margin: 1px 2px 1px 0; }
  h3 { font-size: 13px; margin: 16px 0 6px; }
  .state-active { color: var(--ok); } .state-pending_approval, .state-approved, .state-publishing { color: var(--warn); }
  .state-failed, .state-rejected { color: var(--bad); } .state-withdrawn, .state-rolled_back, .state-superseded, .state-skipped { color: var(--muted); }
  pre { background: var(--chip); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin: 6px 0; }
  textarea { width: 100%; min-height: 160px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  input[type=text] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button.action { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; font: inherit; margin-right: 6px; }
  a { color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.danger { color: var(--bad); }
  .muted { color: var(--muted); } .error { color: var(--bad); white-space: pre-wrap; } .success { color: var(--ok); }
  pre.diff span.add { color: var(--ok); } pre.diff span.del { color: var(--bad); } pre.diff span.hunk { color: var(--muted); }
  details.file { margin: 6px 0; } details.file summary { cursor: pointer; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .login { text-align: center; padding: 60px 16px; }
  [hidden] { display: none !important; }
  .badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--warn); color: var(--panel); font-size: 11px; font-weight: 600; text-align: center; }
  .form { display: grid; grid-template-columns: 200px 1fr; gap: 10px 14px; align-items: start; }
  .form label { color: var(--muted); padding-top: 6px; } .form .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .form textarea { min-height: 60px; } .form input[type=number] { width: 140px; }
  @media (max-width: 700px) { .form { grid-template-columns: 1fr; } .form label { padding-top: 0; } }
  .review { border-left: 3px solid var(--accent); padding: 8px 12px; margin: 10px 0; background: var(--bg); }
  dl.facts { display: grid; grid-template-columns: 200px 1fr; gap: 6px 14px; margin: 0; } dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .label { color: var(--muted); font-size: 12px; } .tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .meter { display: inline-block; width: 80px; height: 8px; border-radius: 4px; background: var(--chip); vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--ok); } .meter span.warn { background: var(--warn); } .meter span.bad { background: var(--bad); }
  svg.bars rect { fill: var(--accent); } svg.bars text { fill: var(--muted); font-size: 10px; }
  select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
</style>
</head>
<body>
<header>
  <h1>Project registry</h1>
  <nav id="nav" hidden>
    <button data-view="inbox">Waiting for me <span id="badge" class="badge" hidden></span></button>
    <button data-view="projects">Projects</button>
    <button data-view="agents">Agents</button>
    <button data-view="exceptions">Exceptions</button>
    <button data-view="catalog">Catalog</button>
    <button data-view="settings">Settings</button>
    <button data-view="changes">Changes</button>
    <button data-view="publications">Publications</button>
    <button data-view="usage">Usage</button>
    <button data-view="explain">Why denied?</button>
    <button data-view="audit" id="nav-audit">Audit</button>
    <button data-view="status">Status</button>
  </nav>
  <span class="spacer"></span>
  <span class="me"><span id="who" class="muted"></span>
  <button id="logout" class="action" hidden>Log out</button></span>
</header>
<main id="main"></main>

<script>
"use strict";
// --- helpers: every value from the API goes in as text, never as HTML ---
const $main = document.getElementById("main");
// Fills the page. Skips null and undefined: replaceChildren would print them as text.
const show = (...nodes) => $main.replaceChildren(...nodes.flat().filter((x) => x != null));
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined) e.append(c instanceof Node ? c : String(c));
  return e;
}
const json = (v) => JSON.stringify(v, null, 2);
const when = (t) => t ? new Date(t).toLocaleString() : "";

// --- login: authorization code with PKCE against the realm, tokens in sessionStorage ---
let config = null;
const store = sessionStorage;
function b64url(bytes) { return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
// crypto.subtle exists only in secure contexts (HTTPS or localhost); on plain
// http://registry.test it is undefined, so the challenge falls back to this.
function sha256(data) {
  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
  const len = data.length, blocks = Math.ceil((len + 9) / 64), m = new Uint8Array(blocks * 64);
  m.set(data); m[len] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(m.length - 4, len * 8); dv.setUint32(m.length - 8, Math.floor(len / 0x20000000));
  const w = new Uint32Array(64), rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < m.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = w[i - 16] + s0 + w[i - 7] + s1;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
  }
  const out = new DataView(new ArrayBuffer(32));
  H.forEach((v, i) => out.setUint32(i * 4, v));
  return out.buffer;
}
async function pkce() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const bytes = new TextEncoder().encode(verifier);
  const digest = crypto.subtle ? await crypto.subtle.digest("SHA-256", bytes) : sha256(bytes);
  return { verifier, challenge: b64url(digest) };
}
const redirectUri = () => location.origin + "/portal/";
async function login() {
  const { verifier, challenge } = await pkce();
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  store.setItem("pkce", JSON.stringify({ verifier, state, route: location.hash }));
  const q = new URLSearchParams({ client_id: config.clientId, response_type: "code", scope: "openid",
    redirect_uri: redirectUri(), code_challenge: challenge, code_challenge_method: "S256", state });
  location.assign(`${config.issuer}/protocol/openid-connect/auth?${q}`);
}
async function tokenRequest(params) {
  const r = await fetch(`${config.issuer}/protocol/openid-connect/token`, { method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: config.clientId, ...params }) });
  if (!r.ok) throw new Error("token request failed: " + r.status);
  const t = await r.json();
  store.setItem("tokens", JSON.stringify({ access: t.access_token, refresh: t.refresh_token, id: t.id_token }));
}
async function finishLogin() {
  const q = new URLSearchParams(location.search);
  if (!q.has("code")) return;
  const saved = JSON.parse(store.getItem("pkce") || "{}");
  history.replaceState(null, "", "/portal/" + (saved.route || ""));   // back where the login started
  if (q.get("state") !== saved.state) throw new Error("login state does not match");
  store.removeItem("pkce");
  await tokenRequest({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: redirectUri(), code_verifier: saved.verifier });
}
function tokens() { return JSON.parse(store.getItem("tokens") || "null"); }
function logout() {
  const t = tokens();
  store.removeItem("tokens");
  const q = new URLSearchParams({ client_id: config.clientId, post_logout_redirect_uri: redirectUri() });
  if (t && t.id) q.set("id_token_hint", t.id);
  location.assign(`${config.issuer}/protocol/openid-connect/logout?${q}`);
}

// --- API: refresh once on 401 ---
async function api(method, path, body) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const t = tokens();
    const r = await fetch(path, { method, headers: { "Authorization": `Bearer ${t ? t.access : ""}`,
      ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 && attempt === 0 && t && t.refresh) {
      try { await tokenRequest({ grant_type: "refresh_token", refresh_token: t.refresh }); continue; }
      catch { store.removeItem("tokens"); return login(); }
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const err = new Error(describe(data.detail) || `${r.status}`); err.status = r.status; throw err; }
    return data;
  }
}
function describe(detail) {
  if (!detail) return "";
  if (typeof detail === "string") return detail;
  if (detail.errors) return detail.errors.join("\n");
  return json(detail);
}

// --- views ---
let me = null;
// Every view has an address (#/changes/82, #/projects/admin, #/usage?project=admin&days=7),
// so a change can be sent to its approvers, and Back and reload work.
const views = { inbox: viewInbox, projects: viewProjects, agents: viewAgents, exceptions: viewExceptions, catalog: viewCatalog,
  settings: viewSettings, changes: viewChanges, publications: viewPublications, usage: viewUsage, status: viewStatus,
  explain: viewExplain, audit: viewAudit };
function go(path) { const h = "#/" + path; if (location.hash === h) route(); else location.hash = h; }
function route() {
  const [path, query] = location.hash.replace(/^#\/?/, "").split("?");
  const [view, id] = path.split("/").map(decodeURIComponent);
  const name = views[view] ? view : "inbox";
  show_nav(name);
  show(el("p", { class: "muted" }, "Loading…"));
  const params = Object.fromEntries(new URLSearchParams(query || ""));
  const page = name === "projects" && id ? viewProject(id) : name === "changes" && id ? viewChange(Number(id)) : views[name](params || {});
  page.catch((e) => show(el("p", { class: "error" }, e.message)));
  refreshBadge();
}
async function refreshBadge() {
  try {
    const n = (await api("GET", "/changes?awaiting=me")).length;
    const b = document.getElementById("badge"); b.textContent = n; b.hidden = !n;
  } catch { /* the badge is a hint; the inbox itself says what failed */ }
}

async function viewInbox() {
  const changes = await api("GET", "/changes?awaiting=me");
  show(el("section", { class: "panel" }, el("h2", {}, "Waiting for me"),
    el("p", { class: "muted" }, "Changes with an open approval you may give: not your own, not yet decided by you."),
    changes.length ? changesTable(changes, true) : el("p", {}, "Nothing waits for you.")));
}

// Propose a change in two steps: Review asks the registry what submitting would file (validated
// as a submit is, and who must approve it), then Submit files exactly what was reviewed. body()
// builds the request; an edit in `watch` after a review asks for a new one.
function proposal(collection, id, op, body, label, watch) {
  const out = el("div");
  const submitBtn = el("button", { class: "action primary", disabled: "" }, "Submit change");
  let reviewed = null;
  const stale = () => { if (reviewed) { reviewed = null; submitBtn.setAttribute("disabled", ""); out.replaceChildren(el("p", { class: "muted" }, "Edited since the review: review again.")); } };
  for (const ev of ["input", "change"]) (watch || []).forEach((w) => w.addEventListener(ev, stale));
  const review = async () => {
    submitBtn.setAttribute("disabled", ""); reviewed = null;
    let b;
    try { b = body(); } catch (e) { out.replaceChildren(el("p", { class: "error" }, e.message)); return; }
    out.replaceChildren(el("p", { class: "muted" }, "Checking…"));
    try {
      const p = await api("POST", "/changes/preview", { collection, object_id: id, op, ...b });
      const diff = changedPaths(p.before, p.after);
      out.replaceChildren(el("div", { class: "review" },
        el("p", {}, "Needs approval from: ", p.required_approvals.map((r) => el("span", { class: "chip" }, r)), " (never from you)."),
        diff.length ? el("table", {}, el("tbody", {}, diff.map(([k, a, z]) => el("tr", {}, el("td", {}, el("code", {}, k)), el("td", { class: "muted" }, a), el("td", {}, "→ ", z)))))
                    : el("p", { class: "muted" }, "The whole record is created or removed.")));
      reviewed = b; submitBtn.removeAttribute("disabled");
    } catch (e) { out.replaceChildren(el("p", { class: "error" }, e.message)); }
  };
  submitBtn.addEventListener("click", async () => {
    if (!reviewed) return;
    try {
      const path = `/${collection}/${encodeURIComponent(id)}`;
      const ch = op === "create" ? await api("POST", path, reviewed) : op === "delete" ? await api("DELETE", path) : await api("PATCH", path, reviewed);
      go(`changes/${ch.id}`);
    } catch (e) { out.replaceChildren(el("p", { class: "error" }, e.message)); }
  });
  return el("div", {}, el("div", { class: "row" }, el("button", { class: "action", onclick: review }, label || "Review change"), submitBtn), out);
}
// Field paths that differ, with the value before and after ("—" for absent).
function changedPaths(a, z, prefix = "") {
  const show = (v) => v === undefined || v === null ? "—" : typeof v === "object" && !Array.isArray(v) ? json(v) : Array.isArray(v) ? v.join(", ") : String(v);
  const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
  if (isObj(a) && isObj(z)) {
    return [...new Set([...Object.keys(a), ...Object.keys(z)])].sort().flatMap((k) => changedPaths(a[k], z[k], prefix ? `${prefix}.${k}` : k));
  }
  return json(a ?? null) === json(z ?? null) ? [] : [[prefix || "(record)", show(a), show(z)]];
}

async function viewProjects() {
  const projects = await api("GET", "/projects");
  const rows = Object.entries(projects).map(([id, p]) => el("tr", { class: "clickable", onclick: () => go(`projects/${encodeURIComponent(id)}`) },
    el("td", {}, el("strong", {}, id)), el("td", {}, p.data_class), el("td", {}, (p.placement || []).map((x) => el("span", { class: "chip" }, x))),
    el("td", {}, p.limits && p.limits.requests_per_minute ? `${p.limits.requests_per_minute}/min` : "—"),
    el("td", {}, p.budget ? `$${p.budget.usd_per_30_days}` : "—"), el("td", { class: "muted" }, p.description || "")));
  const list = el("table", {}, el("thead", {}, el("tr", {}, ["Project", "Data class", "Placement", "Requests", "Budget / 30 days", "Description"].map((h) => el("th", {}, h)))), el("tbody", {}, rows));
  show(
    el("section", { class: "panel" }, el("div", { class: "row" }, el("h2", { style: "margin:0" }, "Projects"), el("span", { class: "spacer" }), filterInput(list)), list),
    newProjectPanel());
}

async function viewProject(id) {
  const [record, changes, settings, models, agents] = await Promise.all([api("GET", `/projects/${encodeURIComponent(id)}`),
    api("GET", `/changes?object_id=${encodeURIComponent(id)}&limit=20`), api("GET", "/settings"), api("GET", "/models"), api("GET", "/agents")]);
  // An agent's keys are on its own record, so a project whose callers are all agents has no keys of its own.
  const agentKeys = Object.entries(agents).filter(([, a]) => a.project === id).flatMap(([aid, a]) => (a.keys || []).map((k) => `${k} (agent ${aid})`));
  const p = record.spec;
  const classes = settings.data_classes || {};
  const fmt = (v) => v === undefined || v === null || (Array.isArray(v) && !v.length) ? el("span", { class: "muted" }, "—") : Array.isArray(v) ? v.map((x) => el("span", { class: "chip" }, x)) : String(v);
  const facts = el("dl", { class: "facts" }, [
    ["Owner", p.owner], ["Data class", p.data_class], ["Placement", p.placement || (classes[p.data_class] ? [...classes[p.data_class], "(all its class allows)"] : null)],
    ["Models", (p.models || {}).allow || ["*"]], ["Model for auto", p.routing || "cheapest"], ["MCP tools", p.mcp_tools],
    ["Requests per minute", (p.limits || {}).requests_per_minute ?? "no limit"], ["Tokens per minute", (p.limits || {}).tokens_per_minute ?? "no limit"],
    ["Budget per 30 days", p.budget ? `$${p.budget.usd_per_30_days}` : "no cap"], ["Keys", p.keys], ["Agents' keys", agentKeys], ["Calls deployments directly", p.deployments ? "yes" : "no"],
  ].flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, fmt(v))]));
  const open = changes.find((c) => ["pending_approval", "approved", "publishing"].includes(c.state));
  show(
    el("section", { class: "panel" }, el("div", { class: "row" }, el("h2", { style: "margin:0" }, `Project ${id}`), el("span", { class: "spacer" }),
      el("a", { href: `#/usage?project=${encodeURIComponent(id)}` }, "Usage")),
      el("p", { class: "muted" }, p.description || "", ` Record revision ${record.revision}.`), facts),
    effectivePanel(id),
    el("section", { class: "panel" }, el("h2", {}, "Propose a change"),
      open ? el("p", { class: "error" }, "Change ", el("a", { href: `#/changes/${open.id}` }, `#${open.id}`), ` for this project is ${open.state}: a new one can be filed once it is done.`) : null,
      projectForm(id, p, classes, Object.keys(models).sort())),

function panelHead(title, ...extra) {

// Hides the table's rows that don't contain the text.
function filterInput(tableEl, placeholder = "filter") {
  const i = el("input", { type: "search", placeholder });
  i.addEventListener("input", () => {
    const t = i.value.trim().toLowerCase();
    for (const tr of tableEl.querySelectorAll("tbody tr")) tr.hidden = !!t && !tr.textContent.toLowerCase().includes(t);
  });
  return i;
}

// rows: a function, called on click, of arrays of plain values. A text cell that a
// spreadsheet would run as a formula (= + - @ first) is quoted as text; numbers stay numbers.
function csvButton(name, heads, rows) {
  const cell = (v) => {
    if (v === null || v === undefined) return "";
    if (typeof v === "number") return String(v);
    v = String(v);
    if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
    return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  };
  return el("button", { class: "action", onclick: () => {
    const text = [heads, ...rows()].map((r) => r.map(cell).join(",")).join("\r\n") + "\r\n";
    const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "text/csv" })), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } }, "CSV");
}

  const opts = { actor: params.actor || "", action: params.action || "", q: params.q || "", page: Number(params.page) || 0 };
  const goAudit = (o) => go(`audit?${new URLSearchParams(Object.entries({ ...opts, ...o }).filter(([k, v]) => v !== "" && !(k === "page" && !v)))}`);
  const field = (k, ph) => { const i = el("input", { type: "search", placeholder: ph, value: opts[k], size: 18 }); i.addEventListener("change", () => goAudit({ [k]: i.value.trim(), page: 0 })); return i; };
  const query = new URLSearchParams({ limit: PAGE + 1, offset: opts.page * PAGE });
  for (const k of ["actor", "action", "q"]) if (opts[k]) query.set(k, opts[k]);
  const found = await api("GET", `/audit?${query}`);
  const rows = found.slice(0, PAGE);
  const details = (e) => e.before || e.after ? el("details", {}, el("summary", { class: "muted" }, "details"),
    el("div", { class: "grid2" }, el("pre", {}, json(e.before)), el("pre", {}, json(e.after)))) : null;
  const objectLink = (o) => { const m = /^change\/(\d+)$/.exec(o) || /^\w+\/(.+)$/.exec(o); return o.startsWith("change/") && m
    ? el("a", { href: `#/changes/${m[1]}` }, o) : o.startsWith("project/") ? el("a", { href: `#/projects/${encodeURIComponent(o.slice(8))}` }, o) : el("code", {}, o); };
  const csv = csvButton("audit.csv", ["seq", "at", "actor", "action", "object", "before", "after"],
    () => rows.map((e) => [e.seq, e.at, e.actor, e.action, e.object, e.before ? JSON.stringify(e.before) : "", e.after ? JSON.stringify(e.after) : ""]));
  show(el("section", { class: "panel" }, el("div", { class: "row" }, el("h2", { style: "margin:0" }, "Audit log"), el("span", { class: "spacer" }),
      field("actor", "actor (exact)"), field("action", "action (exact)"), field("q", "object contains"), csv),
    el("p", { class: "muted" }, "Every change, decision, publication, rollback and key map write, newest first."),
    rows.length ? table(["#", "When", "Actor", "Action", "Object", ""], rows.map((e) => el("tr", {},
      el("td", { class: "muted" }, e.seq), el("td", {}, when(e.at)), el("td", {}, e.actor), el("td", {}, el("span", { class: "chip" }, e.action)),
      el("td", {}, objectLink(e.object)), el("td", {}, details(e))))) : el("p", { class: "muted" }, "Nothing matches."),
    pager(opts.page, found.length > PAGE, (page) => goAudit({ page }))));
}

function show_nav(view) { for (const b of document.querySelectorAll("nav button")) b.classList.toggle("active", b.dataset.view === view); }

// --- start ---
(async () => {
  try {
    config = await (await fetch("/portal/config.json")).json();
    await finishLogin();
    if (!tokens()) {
      show(el("div", { class: "login" }, el("p", {}, "Projects, agents and exceptions of the AI gateway, changed by request and approval."),
        el("button", { class: "action primary", onclick: () => login().catch((e) => alert("Login failed: " + e.message)) }, "Log in with Keycloak")));
      return;
    }
    me = await api("GET", "/me");
    const who = document.getElementById("who"); who.textContent = me.name; who.title = me.groups.join(", ");
    document.getElementById("nav").hidden = false;
    // the audit log is for the approver groups (GET /audit answers 403 to anyone else)
    document.getElementById("nav-audit").hidden = !["platform-admins", "security-reviewers", "cost-owners"].some((g) => me.groups.includes(g));
    const out = document.getElementById("logout"); out.hidden = false; out.onclick = logout;
    for (const b of document.querySelectorAll("nav button")) b.onclick = () => go(b.dataset.view);
    window.addEventListener("hashchange", route);
    route();
  } catch (e) { show(el("p", { class: "error" }, e.message)); }
})();
</script>
