name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: opa
        run: |
          mkdir -p .bin
          curl -fsSL -o .bin/opa https://github.com/open-policy-agent/opa/releases/download/v1.22.2/opa_linux_amd64_static
          chmod +x .bin/opa
          echo "$PWD/.bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: pip install jsonschema pyyaml
      - run: ./scripts/validate.sh
